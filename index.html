<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Scrap Montage v1</title>
<style>
:root{
  --bg:#fff7fb;--card:#fff;--ink:#403641;--muted:#8b7f89;--accent:#d879a6;
  --accent2:#f3c5d9;--line:#eadde5;--shadow:0 8px 24px rgba(88,55,76,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,select,input{font:inherit}
.app{max-width:720px;margin:auto;padding:20px 16px 36px}
header{text-align:center;padding:8px 0 18px}
h1{margin:0;font-size:28px;letter-spacing:-.5px}
.subtitle{margin:5px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.label{font-weight:750;font-size:14px;margin-bottom:9px}
.row{display:flex;gap:9px;align-items:center}
button,.file-btn{border:0;border-radius:15px;padding:13px 15px;background:#f7edf3;color:var(--ink);font-weight:700;cursor:pointer}
.primary{background:var(--accent);color:white;width:100%;padding:15px;font-size:16px}
button:disabled{opacity:.45;cursor:not-allowed}
.file-btn{display:block;text-align:center;flex:1}
input[type=file]{display:none}
.stat{font-size:13px;color:var(--muted);margin-top:9px}
select{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink)}
.range{width:100%}
.small{font-size:12px;color:var(--muted)}
.hidden{display:none!important}
#status{white-space:pre-line;font-size:13px;color:var(--muted);margin-top:10px}
.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview-item{background:#faf5f8;border:1px solid var(--line);border-radius:15px;padding:7px}
.preview-item img{width:100%;display:block;border-radius:10px;background:white}
.preview-item button{width:100%;margin-top:6px;padding:9px}
#editor{position:fixed;inset:0;background:rgba(28,20,26,.72);z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}
.editor-card{width:min(680px,100%);max-height:96vh;overflow:auto;background:white;border-radius:24px;padding:14px}
.editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.editor-title{font-weight:800;cursor:default}
.canvas-wrap{background:#eee;border-radius:16px;overflow:hidden;touch-action:none}
#editCanvas{width:100%;display:block}
.editor-actions{display:flex;gap:8px;margin-top:10px}
.editor-actions button{flex:1}
.hint{text-align:center;color:var(--muted);font-size:12px;margin:8px 0 0}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>✨ Scrap Montage</h1>
  <div class="subtitle">Tes photos, tes montages, directement sur ton téléphone.</div>
  <button id="installBtn" class="hidden" style="margin-top:10px">📲 Installer l’appli</button>
</header>

<section class="card">
  <div class="label">📷 Photos</div>
  <div class="row">
    <label class="file-btn">Sélectionner des photos
      <input id="files" type="file" accept="image/*" multiple>
    </label>
  </div>
  <div id="fileStat" class="stat">Aucune photo sélectionnée.</div>
</section>

<section class="card">
  <div class="label">📐 Format d'impression</div>
  <select id="format">
    <option value="10x15">10 × 15 cm</option>
    <option value="13x18">13 × 18 cm</option>
    <option value="a4">A4</option>
    <option value="custom">Personnalisé</option>
  </select>
  <div id="customBox" class="hidden" style="margin-top:10px">
    <div class="row">
      <input id="cw" type="number" min="1" step=".1" placeholder="Largeur cm" style="width:50%;padding:11px;border:1px solid var(--line);border-radius:12px">
      <input id="ch" type="number" min="1" step=".1" placeholder="Hauteur cm" style="width:50%;padding:11px;border:1px solid var(--line);border-radius:12px">
    </div>
  </div>
</section>

<section class="card">
  <div class="label">⚙️ Mise en page</div>
  <div class="small">Espacement entre les photos : <b id="gapVal">0,15 cm</b></div>
  <input id="gap" class="range" type="range" min="0" max="1" step=".05" value=".15">
  <div style="height:8px"></div>
  <div class="small">Bordure extérieure : <b id="marginVal">0 cm</b></div>
  <input id="margin" class="range" type="range" min="0" max="1" step=".05" value="0">
</section>

<section class="card">
  <div class="label">📂 Destination</div>
  <button id="chooseDir" style="width:100%">Choisir le dossier</button>
  <div id="dirStat" class="stat">Aucun dossier choisi.</div>
</section>

<section class="card">
  <button id="prepare" class="primary" disabled>✨ Préparer les montages</button>
  <div id="status"></div>
</section>

<section id="previewSection" class="card hidden">
  <div class="label">👀 Aperçu</div>
  <div id="previewGrid" class="preview-grid"></div>
  <div style="height:12px"></div>
  <button id="generate" class="primary">✨ Générer les montages</button>
</section>
</div>

<div id="editor" class="hidden">
  <div class="editor-card">
    <div class="editor-head">
      <div id="editorTitle" class="editor-title">Photo</div>
      <button id="closeEditor">✕</button>
    </div>
    <div class="canvas-wrap">
      <canvas id="editCanvas"></canvas>
    </div>
    <div class="hint">👆 Déplace • 🤏 Pince pour zoomer</div>
    <div class="editor-actions">
      <button id="resetEdit">↶ Réinitialiser</button>
      <button id="saveEdit" class="primary">✓ Valider</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const filesEl=$("files"), formatEl=$("format"), gapEl=$("gap"), marginEl=$("margin");
const prepareBtn=$("prepare"), generateBtn=$("generate"), previewSection=$("previewSection");
let photos=[], montages=[], outputDir=null, editing=null;

function cmToPx(cm){return Math.round(cm*118.11)} // ~300 DPI
function getFormat(){
  if(formatEl.value==="10x15") return [10,15];
  if(formatEl.value==="13x18") return [13,18];
  if(formatEl.value==="a4") return [21,29.7];
  return [parseFloat($("cw").value)||10,parseFloat($("ch").value)||15];
}
function getSettings(){
  return {gap:parseFloat(gapEl.value), margin:parseFloat(marginEl.value)}
}
formatEl.onchange=()=> $("customBox").classList.toggle("hidden",formatEl.value!=="custom");
gapEl.oninput=()=> $("gapVal").textContent=parseFloat(gapEl.value).toFixed(2).replace(".",",")+" cm";
marginEl.oninput=()=> $("marginVal").textContent=parseFloat(marginEl.value).toFixed(2).replace(".",",")+" cm";

filesEl.onchange=async()=>{
  photos=Array.from(filesEl.files).filter(f=>f.type.startsWith("image/"));
  $("fileStat").textContent=photos.length?`${photos.length} photo${photos.length>1?"s":""} sélectionnée${photos.length>1?"s":""} → ${Math.ceil(photos.length/4)} montage${Math.ceil(photos.length/4)>1?"s":""}`:"Aucune photo sélectionnée.";
  prepareBtn.disabled=photos.length===0;
  previewSection.classList.add("hidden");
};

$("chooseDir").onclick=async()=>{
  if(!window.showDirectoryPicker){
    $("dirStat").textContent="Ton navigateur ne permet pas le choix direct d'un dossier. Les fichiers pourront quand même être enregistrés manuellement.";
    return;
  }
  try{
    outputDir=await window.showDirectoryPicker({mode:"readwrite"});
    $("dirStat").textContent="✓ Dossier de destination sélectionné.";
  }catch(e){}
};

async function loadImage(file){
  return await new Promise((res,rej)=>{
    const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u);res(im)};
    im.onerror=rej; im.src=u;
  });
}
function createState(img){
  return {img, x:.5,y:.5,zoom:1};
}
function drawPhoto(ctx,state,x,y,w,h){
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  const im=state.img, ar=im.width/im.height, tar=w/h;
  let dw,dh;
  if(ar>tar){dh=h*state.zoom;dw=dh*ar}else{dw=w*state.zoom;dh=dw/ar}
  const cx=x+w*state.x, cy=y+h*state.y;
  ctx.drawImage(im,cx-dw/2,cy-dh/2,dw,dh);
  ctx.restore();
}
async function makeMontageCanvas(m){
  const [Wcm,Hcm]=getFormat(), W=cmToPx(Wcm), H=cmToPx(Hcm), s=getSettings();
  const c=document.createElement("canvas");c.width=W;c.height=H;
  const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  const gap=cmToPx(s.gap), mar=cmToPx(s.margin);
  const innerW=W-2*mar, innerH=H-2*mar;
  const cellW=(innerW-gap)/2, cellH=(innerH-gap)/2;
  const pos=[[mar,mar],[mar+cellW+gap,mar],[mar,mar+cellH+gap],[mar+cellW+gap,mar+cellH+gap]];
  for(let i=0;i<4;i++){
    if(m[i]) drawPhoto(ctx,m[i],pos[i][0],pos[i][1],cellW,cellH);
    else {ctx.fillStyle="#fff";ctx.fillRect(pos[i][0],pos[i][1],cellW,cellH)}
  }
  return c;
}
prepareBtn.onclick=async()=>{
  $("status").textContent="Préparation des montages…";
  montages=[];
  for(let i=0;i<photos.length;i+=4){
    const group=[];
    for(let j=0;j<4;j++) group.push(photos[i+j]?createState(await loadImage(photos[i+j])):null);
    montages.push(group);
  }
  $("status").textContent="";
  await renderPreviews();
  previewSection.classList.remove("hidden");
  previewSection.scrollIntoView({behavior:"smooth"});
};

async function renderPreviews(){
  const grid=$("previewGrid");grid.innerHTML="";
  for(let i=0;i<montages.length;i++){
    const c=await makeMontageCanvas(montages[i]);
    const div=document.createElement("div");div.className="preview-item";
    const previewWrap=document.createElement("div");
    previewWrap.style.position="relative";
    const im=document.createElement("img");im.src=c.toDataURL("image/jpeg",.92);
    previewWrap.append(im);

    // Four small edit buttons, one per photo.
    for(let slot=0;slot<4;slot++){
      if(!montages[i][slot]) continue;
      const edit=document.createElement("button");
      edit.textContent="✎";
      edit.title=`Modifier la photo ${slot+1}`;
      edit.setAttribute("aria-label",`Modifier la photo ${slot+1}`);
      edit.style.position="absolute";
      edit.style.width="34px";
      edit.style.height="34px";
      edit.style.padding="0";
      edit.style.borderRadius="50%";
      edit.style.background="rgba(255,255,255,.94)";
      edit.style.boxShadow="0 3px 10px rgba(0,0,0,.18)";
      edit.style.fontSize="17px";
      const positions=[
        ["8px","8px"],["calc(50% + 8px)","8px"],
        ["8px","calc(50% + 8px)"],["calc(50% + 8px)","calc(50% + 8px)"]
      ];
      edit.style.left=positions[slot][0];
      edit.style.top=positions[slot][1];
      edit.onclick=()=>openEditor(i,slot);
      previewWrap.append(edit);
    }

    const b=document.createElement("button");
    b.textContent=`Modifier le montage ${i+1}`;
    b.onclick=()=>openEditor(i,montages[i].findIndex(x=>x));
    div.append(previewWrap,b);grid.append(div);
  }
}
function openEditor(index, slot=0){
  editing={index,slot,base:null,start:null,orig:null};
  const m=montages[index];
  if(!m[slot]) return;
  $("editor").classList.remove("hidden");
  $("editorTitle").textContent=`Montage ${index+1} — Photo ${slot+1}`;
  drawEditor();
}
function drawEditor(){
  const m=montages[editing.index], state=m[editing.slot];
  const [Wcm,Hcm]=getFormat(), W=cmToPx(Wcm),H=cmToPx(Hcm);
  const c=$("editCanvas");c.width=W;c.height=H;
  const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  const gap=cmToPx(parseFloat(gapEl.value)),mar=cmToPx(parseFloat(marginEl.value));
  const cw=(W-2*mar-gap)/2,ch=(H-2*mar-gap)/2;
  const pos=[[mar,mar],[mar+cw+gap,mar],[mar,mar+ch+gap],[mar+cw+gap,mar+ch+gap]];
  for(let i=0;i<4;i++) m[i]?drawPhoto(ctx,m[i],pos[i][0],pos[i][1],cw,ch):ctx.fillStyle="#fff";
}
function canvasPoint(ev){
  const r=$("editCanvas").getBoundingClientRect();
  return {x:(ev.clientX-r.left)/r.width,y:(ev.clientY-r.top)/r.height};
}
let pointers=new Map(), lastDist=0;
$("editCanvas").addEventListener("pointerdown",e=>{pointers.set(e.pointerId,e);$("editCanvas").setPointerCapture(e.pointerId)});
$("editCanvas").addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,e);
  const state=montages[editing.index][editing.slot];
  if(!state)return;
  const arr=[...pointers.values()];
  if(arr.length===1){
    const p=canvasPoint(e), prev=editing.last;
    if(prev){
      state.x=Math.max(-1,Math.min(2,state.x+(p.x-prev.x)));
      state.y=Math.max(-1,Math.min(2,state.y+(p.y-prev.y)));
      drawEditor();
    }
    editing.last=p;
  }else if(arr.length===2){
    const a=arr[0],b=arr[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(lastDist){state.zoom=Math.max(.5,Math.min(5,state.zoom*(d/lastDist)));drawEditor()}
    lastDist=d;
  }
});
$("editCanvas").addEventListener("pointerup",e=>{pointers.delete(e.pointerId);editing.last=null;if(pointers.size<2)lastDist=0});
$("editCanvas").addEventListener("pointercancel",e=>{pointers.delete(e.pointerId);editing.last=null;lastDist=0});

$("resetEdit").onclick=()=>{const s=montages[editing.index][editing.slot];s.x=.5;s.y=.5;s.zoom=1;drawEditor()};
$("saveEdit").onclick=async()=>{
  $("editor").classList.add("hidden"); await renderPreviews();
};
$("closeEditor").onclick=()=>$("editor").classList.add("hidden");



generateBtn.onclick=async()=>{
  if(!montages.length)return;
  $("status").textContent="Génération en cours…";
  for(let i=0;i<montages.length;i++){
    const c=await makeMontageCanvas(montages[i]);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.94));
    const name=`montage_${String(i+1).padStart(3,"0")}.jpg`;
    if(outputDir){
      try{
        const fh=await outputDir.getFileHandle(name,{create:true});
        const w=await fh.createWritable();await w.write(blob);await w.close();
      }catch(e){await downloadBlob(blob,name)}
    }else await downloadBlob(blob,name);
  }
  $("status").textContent=`✓ ${montages.length} montage${montages.length>1?"s":""} généré${montages.length>1?"s":""}.`;
};
function downloadBlob(blob,name){
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}

let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  $("installBtn").classList.remove("hidden");
});
$("installBtn").onclick=async()=>{
  if(!deferredInstallPrompt)return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  $("installBtn").classList.add("hidden");
};
window.addEventListener("appinstalled",()=>{
  $("installBtn").classList.add("hidden");
});
if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}

</script>
</body>
</html>
